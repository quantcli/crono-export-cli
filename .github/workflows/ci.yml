name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever its base. With `branches: [main]` a PR stacked on
  # another PR's branch got no CI at all — not a red check, an absent one — so code
  # could reach main through a chain where it was never linted or tested on its own
  # (QUA-115). `push` stays pinned to main: that trigger answers "is the merged state
  # green", which is a question about main.
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  compat:
    name: compat (CONTRACT machine-attestation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: resolve compat dependency
        # The compat module lives at github.com/quantcli/common/compat
        # under a subpath. `go mod tidy` materializes go.sum for it on
        # first run; subsequent runs are cache-served.
        run: go mod tidy
      - name: build crono-export
        run: go build -o /tmp/crono-export .
      - name: run compat suite
        env:
          # Path the compat-tagged test reads from os.Getenv.
          CRONO_EXPORT_BIN: /tmp/crono-export
        run: go test -tags=compat -run 'TestContract(Dates|Formats)' ./...
